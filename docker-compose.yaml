name: stackyrd

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - APP_ENV=development
      - APP_QUIET_STARTUP=false
      - APP_ENABLE_TUI=false
      - SERVER_PORT=8080
      - REDIS_ENABLED=true
      - REDIS_ADDRESS=redis:6379
      - POSTGRES_ENABLED=true
      - POSTGRES_CONNECTIONS_0_HOST=postgres-primary
      - POSTGRES_CONNECTIONS_0_PORT=5432
      - POSTGRES_CONNECTIONS_1_HOST=postgres-secondary
      - POSTGRES_CONNECTIONS_1_PORT=5432
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - MONGO_ENABLED=true
      - MONGO_CONNECTIONS_0_URI=mongodb://mongo-primary:27017
      - MONGO_CONNECTIONS_1_URI=mongodb://mongo-secondary:27017
      - GRAFANA_ENABLED=true
      - GRAFANA_URL=http://grafana:3000
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY_ID=minioadmin
      - MINIO_SECRET_ACCESS_KEY=minioadmin
      - MINIO_BUCKET_NAME=main
      - CRON_ENABLED=true
      - MCP_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      postgres-secondary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo-primary:
        condition: service_healthy
      mongo-secondary:
        condition: service_healthy
      minio:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-primary:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=stackyrd
      - POSTGRES_PASSWORD=stackyrd123
      - POSTGRES_DB=stackyrd
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackyrd -d stackyrd"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-secondary:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=stackyrd
      - POSTGRES_PASSWORD=stackyrd123
      - POSTGRES_DB=stackyrd
    volumes:
      - postgres_secondary_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackyrd -d stackyrd"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka-native:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-primary:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_primary_data:/data/db
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongo-secondary:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_secondary_data:/data/db
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - stackyrd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  stackyrd:
    driver: bridge

volumes:
  redis_data:
  postgres_primary_data:
  postgres_secondary_data:
  mongo_primary_data:
  mongo_secondary_data:
  grafana_data:
  minio_data:
